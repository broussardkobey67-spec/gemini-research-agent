[project]
name = "gemini-research-agent"
version = "0.1.0"
description = "A small autonomous web-research agent powered by Google Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kobey Broussard" }]
keywords = ["gemini", "ai-agent", "research", "llm", "automation"]
dependencies = [
    "google-genai>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
